name: Signed MSIX Acceptance

on:
  workflow_dispatch:
  pull_request:
    branches: [ main ]

permissions:
  contents: read

concurrency:
  group: signed-msix-acceptance-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  acceptance:
    name: Validate, build, sign, and package x64 MSIX
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: windows-2025-vs2026
    timeout-minutes: 45

    steps:
      - name: Checkout source
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Resolve and validate release metadata
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $release = Get-Content -Raw 'release/release.json' | ConvertFrom-Json
          $version = [string]$release.product.version
          $packageVersion = [string]$release.product.packageVersion
          if ($version -notmatch '^\d+\.\d+\.\d+$') { throw "Invalid display version: $version" }
          if ($packageVersion -ne "$version.0") { throw "packageVersion must be $version.0, found $packageVersion" }
          [xml]$project = Get-Content -Raw 'src/CivVIToolkit.App/CivVIToolkit.App.csproj'
          $projectVersion = @($project.Project.PropertyGroup | ForEach-Object Version | Where-Object { $_ })[0]
          if ($projectVersion -ne $version) { throw "csproj version mismatch: $projectVersion" }
          [xml]$manifest = Get-Content -Raw 'src/CivVIToolkit.App/Package.appxmanifest'
          $identity = $manifest.SelectSingleNode("//*[local-name()='Identity']")
          if ($identity.Version -ne $packageVersion) { throw "manifest version mismatch: $($identity.Version)" }
          if ($identity.Publisher -ne 'CN=AppPublisher') { throw "manifest publisher mismatch: $($identity.Publisher)" }
          "DISPLAY_VERSION=$version" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "PACKAGE_VERSION=$packageVersion" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "ACCEPTANCE_NAME=CivVIToolkit-v$version-x64-signed-msix-acceptance" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Validate localization resources
        shell: pwsh
        run: ./scripts/Test-LocalizationConsistency.ps1

      - name: Restore x64 dependencies
        shell: pwsh
        run: dotnet restore CivVIToolkit.sln -p:Platform=x64 -r win-x64

      - name: Run tests
        shell: pwsh
        run: dotnet test tests/CivVIToolkit.Tests/CivVIToolkit.Tests.csproj -c Release -p:Platform=x64 -r win-x64 --no-restore --verbosity normal

      - name: Validate signing configuration
        shell: pwsh
        env:
          RELEASE_CERTIFICATE_BASE64: ${{ secrets.GH_RELEASE_CERTIFICATE_BASE64 }}
          RELEASE_CERTIFICATE_PASSWORD: ${{ secrets.GH_RELEASE_CERTIFICATE_PASSWORD }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:RELEASE_CERTIFICATE_BASE64) -or [string]::IsNullOrWhiteSpace($env:RELEASE_CERTIFICATE_PASSWORD)) {
            throw 'Expected GH_RELEASE_CERTIFICATE_BASE64 and GH_RELEASE_CERTIFICATE_PASSWORD.'
          }

      - name: Build and sign x64 MSIX
        shell: pwsh
        env:
          RELEASE_CERTIFICATE_BASE64: ${{ secrets.GH_RELEASE_CERTIFICATE_BASE64 }}
          RELEASE_CERTIFICATE_PASSWORD: ${{ secrets.GH_RELEASE_CERTIFICATE_PASSWORD }}
        run: |
          $ErrorActionPreference = 'Stop'
          $assets = Join-Path $env:RUNNER_TEMP $env:ACCEPTANCE_NAME
          New-Item -ItemType Directory -Force -Path $assets | Out-Null
          ./packaging/Build-SignedMsix.ps1 `
            -DisplayVersion $env:DISPLAY_VERSION `
            -PackageVersion $env:PACKAGE_VERSION `
            -OutputDirectory $assets `
            -CertificateBase64 $env:RELEASE_CERTIFICATE_BASE64 `
            -CertificatePassword $env:RELEASE_CERTIFICATE_PASSWORD
          "ACCEPTANCE_ASSETS=$assets" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Build one-click installer package
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $msix = Join-Path $env:ACCEPTANCE_ASSETS "CivVIToolkit_$($env:PACKAGE_VERSION)_x64.msix"
          $cer = Join-Path $env:ACCEPTANCE_ASSETS "CivVIToolkit-$($env:DISPLAY_VERSION).cer"
          ./packaging/New-GitHubOneClickInstallerPackage.ps1 `
            -MsixPath $msix `
            -CertificatePath $cer `
            -OutputDirectory $env:ACCEPTANCE_ASSETS `
            -DisplayVersion $env:DISPLAY_VERSION `
            -PackageVersion $env:PACKAGE_VERSION
          ./packaging/Test-GitHubOneClickInstallerPackage.ps1 `
            -PackageDirectory $env:ACCEPTANCE_ASSETS `
            -ExpectedDisplayVersion $env:DISPLAY_VERSION `
            -ExpectedPackageVersion $env:PACKAGE_VERSION

      - name: Generate SHA-256 manifest
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $files = @(
            (Join-Path $env:ACCEPTANCE_ASSETS "CivVIToolkit_$($env:PACKAGE_VERSION)_x64.msix"),
            (Join-Path $env:ACCEPTANCE_ASSETS "CivVIToolkit-v$($env:DISPLAY_VERSION)-x64-one-click.zip"),
            (Join-Path $env:ACCEPTANCE_ASSETS "CivVIToolkit-$($env:DISPLAY_VERSION).cer")
          )
          $manifest = foreach ($file in $files) {
            if (-not (Test-Path -LiteralPath $file)) { throw "Expected acceptance asset missing: $file" }
            "{0}  {1}" -f (Get-FileHash -LiteralPath $file -Algorithm SHA256).Hash.ToLowerInvariant(), (Split-Path $file -Leaf)
          }
          Set-Content -LiteralPath (Join-Path $env:ACCEPTANCE_ASSETS 'SHA256SUMS.txt') -Value $manifest -Encoding ascii
          Get-Content -LiteralPath (Join-Path $env:ACCEPTANCE_ASSETS 'SHA256SUMS.txt')

      - name: Remove expanded one-click staging folder
        shell: pwsh
        run: |
          $folder = Join-Path $env:ACCEPTANCE_ASSETS "CivVIToolkit-v$($env:DISPLAY_VERSION)-x64-one-click"
          if (Test-Path -LiteralPath $folder) { Remove-Item -LiteralPath $folder -Recurse -Force }

      - name: Upload signed MSIX acceptance artifact
        uses: actions/upload-artifact@v6
        with:
          name: ${{ env.ACCEPTANCE_NAME }}
          path: ${{ env.ACCEPTANCE_ASSETS }}
          if-no-files-found: error
          retention-days: 14
