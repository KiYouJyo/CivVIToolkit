name: CI

on:
  push:
    branches: [ main ]
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: windows-2025-vs2026
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - name: Validate localization resources
        shell: pwsh
        run: ./scripts/Test-LocalizationConsistency.ps1
      - name: Restore
        run: dotnet restore CivVIToolkit.sln -p:Platform=x64
      - name: Build
        run: dotnet build CivVIToolkit.sln -c Release -p:Platform=x64 --no-restore
      - name: Test
        run: dotnet test tests/CivVIToolkit.Tests/CivVIToolkit.Tests.csproj -c Release -p:Platform=x64 --no-restore --logger "trx;LogFileName=test-results.trx"
